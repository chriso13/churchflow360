# ==============================================================================
# 360 Church Flow - Event Service
# Config Repo — served by Config Server to all profiles
# File location: config-server/src/main/resources/config-repo/event-service.yml
# ==============================================================================

server:
  port: 8084

spring:
  application:
    name: event-service

  data:
    mongodb:
      uri: mongodb://churchflow360:mongo_secret@localhost:27017/church360_events?authSource=admin
      auto-index-creation: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

churchflow360:
  kafka:
    topics:
      event-created: event.created
      event-updated: event.updated
      event-cancelled: event.cancelled
      event-rsvp: event.rsvp