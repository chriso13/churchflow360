# ==============================================================================
# 360 Church Flow - Config Repo
# Shared defaults served to ALL microservices by the Config Server
# File location: config-server/src/main/resources/config-repo/application.yml
# ==============================================================================

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    config:
      override-system-properties: false