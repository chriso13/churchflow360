# ==============================================================================
# Notification Service — Config Server Configuration
# Place in: config-server/src/main/resources/config-repo/notification-service.yml
# Port: 8087  |  Database: church360_notifications
# ==============================================================================

server:
  port: 8087

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/church360_notifications
    username: churchflow360
    password: churchflow360pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  # ── Brevo SMTP ──────────────────────────────────────────────────────────────
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:360ChurchFlowSecretKey2026SuperSecureMinimum256BitsLong!!}

# ── Church notification settings ───────────────────────────────────────────────
notification:
  email:
    from-address: ${NOTIFICATION_FROM_EMAIL:noreply@rehoboth360.org}
    from-name: ${NOTIFICATION_FROM_NAME:Rehoboth Pentecostal Church}
    enabled: true

  sms:
    enabled: true
    mysmsgates:
      api-url: https://www.mysmsgates.com/api/send/sms
      username: ${MYSMSGATES_USERNAME}
      password: ${MYSMSGATES_PASSWORD}
      sender-id: ${MYSMSGATES_SENDER_ID:REHOBOTH}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics