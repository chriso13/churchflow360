# ============================================================
# Prayer Request Service — Config Server Configuration
# Place in: config-server/src/main/resources/configurations/
# Service port: 8089
# Database: church360_prayer
# ============================================================

server:
  port: 8089

spring:
  application:
    name: prayer-request-service

  datasource:
    url: jdbc:postgresql://localhost:5432/church360_prayer
    username: churchflow360
    password: churchflow360pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

jwt:
  secret: ${JWT_SECRET:360ChurchFlowSecretKey2026SuperSecureMinimum256BitsLong!!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: Prayer Request Service API
    description: Church prayer request management with privacy levels
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.churchflow360.prayerrequest: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN