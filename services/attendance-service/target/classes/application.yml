# ==============================================================================
# 360 Church Flow - Attendance Service
# Local Development Configuration
# ==============================================================================

server:
  port: 8083

spring:
  application:
    name: attendance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/church360_attendance
    username: churchflow360
    password: churchflow360pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ==============================================================================
# QR code and JWT config
# JWT secret must match auth-service and api-gateway exactly
# ==============================================================================
churchflow360:
  attendance:
    qr:
      size: 300
      expiry-minutes: 30
  jwt:
    secret: ${JWT_SECRET:360ChurchFlowSecretKey2026SuperSecureMinimum256BitsLong!!}
    issuer: 360-church-flow