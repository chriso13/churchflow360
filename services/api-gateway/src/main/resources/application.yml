# ==============================================================================
# 360 Church Flow - API Gateway
# Local Development Configuration — with JWT Security
# ==============================================================================

server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    config:
      enabled: false

    gateway:
      discovery:
        locator:
          enabled: false

      default-filters:
        - PreserveHostHeader
        - RemoveRequestHeader=Cookie

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
              - Authorization
              - Content-Type
              - X-Requester-MembershipNumber
            exposedHeaders:
              - Authorization
            allowCredentials: true
            maxAge: 3600

      routes:

        - id: auth-service-public
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: auth-service-users
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: AuthFilter

        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/api/v1/members/**
          filters:
            - name: AuthFilter

        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/api/v1/attendance/**
          filters:
            - name: AuthFilter

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/v1/events/**
          filters:
            - name: AuthFilter

        - id: pastoral-meeting-service
          uri: lb://pastoral-meeting-service
          predicates:
            - Path=/api/v1/pastoral-meetings/**
          filters:
            - name: AuthFilter

        - id: finance-service-tithes
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/tithes/**
          filters:
            - name: AuthFilter

        - id: finance-service-donations
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/donations/**
          filters:
            - name: AuthFilter

        - id: finance-service-offerings
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/offerings/**
          filters:
            - name: AuthFilter

        - id: finance-service-expenses
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/expenses/**
          filters:
            - name: AuthFilter

        - id: finance-service-summary
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/finance/**
          filters:
            - name: AuthFilter

        - id: finance-service-reports
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - name: AuthFilter

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: AuthFilter

        - id: small-groups-service
          uri: lb://small-groups-service
          predicates:
            - Path=/api/v1/groups/**
          filters:
            - name: AuthFilter

        - id: prayer-request-service
          uri: lb://prayer-request-service
          predicates:
            - Path=/api/v1/prayer-requests/**
          filters:
            - name: AuthFilter

        - id: announcement-service
          uri: lb://announcement-service
          predicates:
            - Path=/api/v1/announcements/**
          filters:
            - name: AuthFilter

# ==============================================================================
# JWT Configuration
# ==============================================================================
churchflow360:
  jwt:
    secret: ${JWT_SECRET:360ChurchFlowSecretKey2026SuperSecureMinimum256BitsLong!!}
    issuer: 360-church-flow

  security:
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /actuator/health
      - /actuator/info
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /fallback/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.churchflow360.gateway: DEBUG

info:
  app:
    name: "360 Church Flow API Gateway"
    version: "1.0.0"
    description: "Central API Gateway — JWT validation and routing"
