server:
  port: 8087

spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/church360_notifications
    username: churchflow360
    password: churchflow360pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN:your-brevo-login@example.com}
    password: ${BREVO_SMTP_KEY:your-brevo-smtp-key}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

churchflow360:
  jwt:
    secret: ${JWT_SECRET:360ChurchFlowSecretKey2026SuperSecureMinimum256BitsLong!!}

# ── Church notification settings ──────────────────────────────────────────────
notification:
  email:
    from-address: ${NOTIFICATION_FROM_EMAIL:noreply@rehoboth360.org}
    from-name: ${NOTIFICATION_FROM_NAME:Rehoboth Pentecostal Church}
    enabled: ${EMAIL_ENABLED:true}

  sms:
    enabled: ${SMS_ENABLED:true}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}

  rabbitmq:
    exchange: churchflow360.events
    queues:
      prayer-request: churchflow360.prayer.request.created
      member-welcome: churchflow360.member.registered
      pastoral-meeting: churchflow360.pastoral.meeting.scheduled
      announcement: churchflow360.announcement.published
      tithe-receipt: churchflow360.finance.tithe.recorded

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.churchflow360.notification: INFO
    org.springframework.mail: DEBUG
