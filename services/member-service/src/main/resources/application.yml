# ==============================================================================
# 360 Church Flow - Member Service
# Local Development Configuration
# ==============================================================================

server:
  port: 8082

spring:
  application:
    name: member-service

  datasource:
    url: jdbc:postgresql://localhost:5432/church360_members
    username: churchflow360
    password: churchflow360pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # ── SMTP Mail — Mailhog (local Docker mail server) ──────────────────────────
  # View emails at: http://localhost:8025
  # To switch to a real SMTP server in production, update these values
  # and set MAIL_USERNAME / MAIL_PASSWORD environment variables.
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # Enable @Async for non-blocking email sending
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ==============================================================================
# Church Flow Mail Configuration
# ==============================================================================
churchflow360:
  jwt:
    secret: ${JWT_SECRET:360ChurchFlowSecretKey2026SuperSecureMinimum256BitsLong!!}
    issuer: 360-church-flow
  mail:
    from-email: noreply@360church.org
    from-name: 360 Church
    enabled: true