# ==============================================================================
# 360 Church Flow - Auth Service
# Local Development Configuration
# ==============================================================================

server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/church360_auth
    username: churchflow360
    password: churchflow360pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Enable Feign clients
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-exclude: /api/v1/auth/internal/**

# ==============================================================================
# JWT Configuration
# ==============================================================================
churchflow360:
  jwt:
    secret: ${JWT_SECRET:360ChurchFlowSecretKey2026SuperSecureMinimum256BitsLong!!}
    access-token-expiry-ms: 86400000
    refresh-token-expiry-ms: 604800000
    issuer: 360-church-flow

# ==============================================================================
# Resilience4j — circuit breaker around member-service verification calls
# If member-service is down, registration with a membershipNumber is rejected.
# ==============================================================================
resilience4j:
  circuitbreaker:
    instances:
      memberService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  retry:
    instances:
      memberService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - feign.FeignException.ServiceUnavailable
          - feign.RetryableException